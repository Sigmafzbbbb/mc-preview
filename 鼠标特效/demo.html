<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标特效演示</title>
    <link rel="stylesheet" href="cursor.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #050810 0%, #0a1128 100%);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 2rem;
        }
        h1 {
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.5rem;
        }
        .demo-area {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        a { color: #a855f7; font-size: 1.2rem; text-decoration: none; }
        button {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
            border: none;
            padding: 0.8rem 1.6rem;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        input, textarea {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            width: 300px;
        }
        p { color: #94a3b8; }
    </style>
</head>
<body>
    <h1>鼠标特效演示</h1>
    <p>移动鼠标查看拖尾效果，点击查看涟漪效果</p>
    <div class="demo-area">
        <a href="#">悬停查看手型光标</a>
        <button>按钮</button>
    </div>
    <div class="demo-area">
        <input type="text" placeholder="输入文字查看文本光标">
    </div>
    <p>将 cursor.css 和 cursor-trail.js 复制到你的网站，按以下方式引入即可使用：</p>
    <code style="color:#a855f7;">&lt;link rel="stylesheet" href="cursor.css"&gt;<br>&lt;script src="cursor-trail.js"&gt;&lt;/script&gt;</code>
    <script src="cursor-trail.js"></script>
</body>
</html>
